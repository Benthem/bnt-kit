name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Versions are tagged here, not by hand: after a green check on main, the
  # version in package.json gets its tag on this commit (once). GitHub does not
  # let this token tag older commits whose workflow differs, so tag as you
  # release, not afterwards.
  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already tagged"
          else
            git tag "$version" "$GITHUB_SHA"
            git push origin "$version"
            echo "tagged $version at $GITHUB_SHA"
          fi
